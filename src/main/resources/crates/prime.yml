prime-crate:
  inventory:
    name: '&8ᴘʀɪᴍᴇ ᴄʀᴀᴛᴇ'
    effect: CHOOSE #here you set it to choose or nowait (/dc seteffect <crate> <effect>)
    rows: 3
    filler-item:
      enable: true
      material: BLACK_STAINED_GLASS_PANE
      name: '&3ᴘʀɪᴍᴇ ᴄʀᴀᴛᴇ'
      lore:
        - '&7With a ᴘʀɪᴍᴇ ᴋᴇʏ you can choose'
        - '&7which of the 7 you want.'
  # Hologram above the crate. Lines with a key counter are shown per player, each player sees their own number:
  # %keys% (virtual + physical), %virtual%, %physical% and %crate_keys_<crate>%.
  # Turn it on/off with enable, or in-game with /crates hologram <crate> on|off (the command wins).
  hologram:
    enable: true
    '1':
      height: 1.5
      lines:
      - '&3ᴘʀɪᴍᴇ ᴄʀᴀᴛᴇ'
      - '&3%crate_keys_prime% &fKeys'
      - '&f/store'
