amethyst-crate:
  inventory:
    name: '&8ᴀᴍᴇᴛʜʏsᴛ ᴄʀᴀᴛᴇ'
    effect: CHOOSE
    rows: 6
    filler-item:
      enable: true
      material: BLACK_STAINED_GLASS_PANE
      name: '&5ᴀᴍᴇᴛʜʏsᴛ ᴄʀᴀᴛᴇ'
      lore:
      - '&7With a ᴀᴍᴇᴛʜʏsᴛ ᴋᴇʏ you can choose'
      - '&7which of the 6 you want.'
  # Hologram above the crate. Lines with a key counter are shown per player, each player sees their own number:
  # %keys% (virtual + physical), %virtual%, %physical% and %crate_keys_<crate>%.
  # Turn it on/off with enable, or in-game with /crates hologram <crate> on|off (the command wins).
  hologram:
    enable: true
    '1':
      height: 1.2
      lines:
      - '&5ᴀᴍᴇᴛʜʏsᴛ ᴄʀᴀᴛᴇ'
      - '&5%crate_keys_amethyst% &fKeys'
      - '&f/store'
  back-button:
    enable: false
    displayname: '&#FF0000ᴄʟᴏꜱᴇ'
    material: RED_STAINED_GLASS_PANE
    slot: 18
    lore:
    - '&fClick to close'
  rewards:
    '1':
      slot: 12
      icon:
        material: NETHERITE_AXE
        name: §5ᴀᴍᴇᴛʜʏꜱᴛ ᴀxᴇ
        lore:
        - §8▬▬▬▬▬▬▬▬▬▬▬▬▬▬
        - §7Chops a whole tree at once
        - '§7Right-click a log: strips the whole tree'
        - §8▬▬▬▬▬▬▬▬▬▬▬▬▬▬
        - '§7Self Destruct:'
        - §f3d
        enchantments:
          efficiency: 5
          fortune: 3
          mending: 1
          sharpness: 5
          unbreaking: 255
      chance: 100.0%
      commands:
      - 'tools give %player% amethyst_axe 3d 1'
    '2':
      slot: 13
      icon:
        material: NETHERITE_PICKAXE
        name: §5ᴀᴍᴇᴛʜʏꜱᴛ ᴘɪᴄᴋᴀxᴇ
        lore:
