name: Crates
main: nl.crates.CratesPlugin
version: ${project.version}
api-version: '1.21'
description: Crates (common, gold, amethyst, crimson, prime) die je aan blokken koppelt
softdepend: [PlaceholderAPI]
commands:
  crates:
    description: Beheer crates
    usage: /crates <link|unlink|list|key|open|hologram|reload>
    aliases: [crate]
    permission: crates.admin
  keys:
    description: Bekijk je virtual keys
    usage: /keys
    permission: crates.use
permissions:
  crates.admin:
    description: Crates koppelen, keys geven en herladen
    default: op
  crates.use:
    description: Crates gebruiken
    default: true
